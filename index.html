<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR Ekosistem Sawah</title>


    <!-- ========================= -->
    <!-- A-FRAME -->
    <!-- ========================= -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js" crossorigin="anonymous"></script>


    <!-- ========================= -->
    <!-- MINDAR -->
    <!-- ========================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" crossorigin="anonymous">
    </script>


    <!-- ========================= -->
    <!-- STYLE -->
    <!-- ========================= -->

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }


        /* ========================= */
        /* PETUNJUK BAWAH */
        /* ========================= */

        #info {
            position: fixed;

            left: 15px;
            right: 15px;
            bottom: 12px;

            text-align: center;

            color: white;

            text-shadow:
                0 0 4px black;

            z-index: 1000;

            pointer-events: none;

            font-size: 13px;
        }


        /* ========================= */
        /* JUDUL ATAS */
        /* ========================= */

        #titleAR {

            position: fixed;

            top: 15px;

            left: 5%;
            right: 5%;

            padding: 10px 15px;

            background:
                rgba(0, 0, 0, 0.65);

            border-radius: 15px;

            color: #FFEB3B;

            text-align: center;

            font-size: 18px;
            font-weight: bold;

            z-index: 1000;

            pointer-events: none;
        }


        /* ========================= */
        /* KETERANGAN RANTAI */
        /* ========================= */

        #chain {

            position: fixed;

            top: 62px;

            left: 3%;
            right: 3%;

            padding: 7px;

            background:
                rgba(0, 0, 0, 0.55);

            border-radius: 12px;

            color: white;

            text-align: center;

            font-size: 11px;

            z-index: 1000;

            pointer-events: none;
        }


        /* ========================= */
        /* PANEL INFORMASI */
        /* ========================= */

        #informationPanel {

            display: none;

            position: fixed;

            left: 5%;
            right: 5%;

            bottom: 48px;

            background:
                rgba(20, 20, 20, 0.94);

            color: white;

            padding: 15px;

            border-radius: 18px;

            z-index: 3000;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.55);
        }


        #informationPanel h2 {

            margin: 0 30px 8px 0;

            text-align: center;

            color: #FFEB3B;

            font-size: 20px;
        }


        #informationPanel p {

            margin: 5px 0;

            line-height: 1.4;

            font-size: 14px;
        }


        #closeInfo {

            position: absolute;

            top: 5px;
            right: 10px;

            border: none;

            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;
        }


        #infoRole {

            color: #81D4FA;

            font-weight: bold;
        }


    </style>


    <!-- ========================= -->
    <!-- SCRIPT INTERAKSI -->
    <!-- ========================= -->

    <script>

        AFRAME.registerComponent(
            'info-object',
            {

                schema: {

                    name: {
                        type: 'string'
                    },

                    role: {
                        type: 'string'
                    },

                    description: {
                        type: 'string'
                    }

                },


                init: function () {

                    const data = this.data;


                    /* Klik */

                    this.el.addEventListener(
                        'click',
                        function () {

                            showInformation(
                                data.name,
                                data.role,
                                data.description
                            );

                        }
                    );


                    /* Touch */

                    this.el.addEventListener(
                        'touchstart',
                        function () {

                            showInformation(
                                data.name,
                                data.role,
                                data.description
                            );

                        }
                    );

                }

            }
        );


        function showInformation(
            name,
            role,
            description
        ) {

            document
                .getElementById("infoTitle")
                .innerText = name;


            document
                .getElementById("infoRole")
                .innerText = role;


            document
                .getElementById("infoDescription")
                .innerText =
                description;


            document
                .getElementById("informationPanel")
                .style.display =
                "block";

        }


        function closeInformation() {

            document
                .getElementById("informationPanel")
                .style.display =
                "none";

        }

    </script>

</head>


<body>


    <!-- ========================= -->
    <!-- JUDUL -->
    <!-- ========================= -->

    <div id="titleAR">

        🌾 RANTAI MAKANAN SAWAH

    </div>


    <!-- ========================= -->
    <!-- ALUR RANTAI -->
    <!-- ========================= -->

    <div id="chain">

        🌱 Rumput
        →
        🦗 Belalang
        →
        🐸 Katak
        →
        🐍 Ular
        →
        🦅 Elang

    </div>


    <!-- ========================= -->
    <!-- PANEL INFORMASI -->
    <!-- ========================= -->

    <div id="informationPanel">

        <button
            id="closeInfo"
            onclick="closeInformation()"
        >
            ×
        </button>


        <h2 id="infoTitle">
            Informasi
        </h2>


        <p>
            <strong>Peran dalam rantai makanan:</strong>
        </p>


        <p id="infoRole"></p>


        <p>
            <strong>Penjelasan:</strong>
        </p>


        <p id="infoDescription"></p>

    </div>


    <!-- ========================= -->
    <!-- PETUNJUK -->
    <!-- ========================= -->

    <div id="info">

        Sentuh objek untuk melihat informasi

    </div>


    <!-- ========================= -->
    <!-- A-SCENE -->
    <!-- ========================= -->

    <a-scene

        mindar-image="
            imageTargetSrc: ./marker-ekosistem-sawah-inner.mind;
            autoStart: true;
            uiScanning: yes;
            uiLoading: yes;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        cursor="
            rayOrigin: mouse;
            fuse: false;
        "

        raycaster="
            objects: .clickable;
            far: 10000;
        "
    >


        <!-- ========================= -->
        <!-- MODEL 3D -->
        <!-- ========================= -->

        <a-assets>


            <!-- RUMPUT -->

            <a-asset-item
                id="rumputModel"
                src="./models/grass.glb">
            </a-asset-item>


            <!-- BELALANG -->

            <a-asset-item
                id="belalangModel"
                src="./models/grasshopper.glb">
            </a-asset-item>


            <!-- KATAK -->

            <a-asset-item
                id="katakModel"
                src="./models/frog.glb">
            </a-asset-item>


            <!-- ULAR -->

            <a-asset-item
                id="ularModel"
                src="./models/snake.glb">
            </a-asset-item>


            <!-- ELANG -->

            <a-asset-item
                id="elangModel"
                src="./models/hawk.glb">
            </a-asset-item>


        </a-assets>


        <!-- ========================= -->
        <!-- KAMERA -->
        <!-- ========================= -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        >
        </a-camera>


        <!-- ========================= -->
        <!-- TARGET MINDAR -->
        <!-- ========================= -->

        <a-entity
            mindar-image-target="
                targetIndex: 0;
            "
        >


            <!-- ================================================= -->
            <!-- RUMPUT -->
            <!-- ================================================= -->

            <a-entity
                position="-0.72 0.03 0"
            >

                <a-gltf-model

                    class="clickable"

                    src="#rumputModel"

                    position="0 0.03 0"

                    rotation="0 0 0"

                    scale="
                        0.020
                        0.020
                        0.020
                    "

                    info-object="
                        name: Rumput;
                        role: Produsen;
                        description: Rumput adalah produsen dalam rantai makanan. Rumput membuat makanan sendiri melalui fotosintesis dan menjadi sumber makanan bagi belalang.
                    "
                >
                </a-gltf-model>


                <a-text

                    value="Rumput"

                    align="center"

                    color="white"

                    position="
                        0
                        -0.07
                        0
                    "

                    scale="
                        0.35
                        0.35
                        0.35
                    "
                >
                </a-text>

            </a-entity>


            <!-- ================================================= -->
            <!-- BELALANG -->
            <!-- ================================================= -->

            <a-entity
                position="-0.36 0.03 0"
            >

                <a-gltf-model

                    class="clickable"

                    src="#belalangModel"

                    position="0 0.02 0"

                    rotation="0 0 0"

                    scale="
                        0.003
                        0.003
                        0.003
                    "

                    info-object="
                        name: Belalang;
                        role: Konsumen tingkat I;
                        description: Belalang memakan rumput untuk memperoleh energi. Belalang kemudian menjadi makanan bagi katak.
                    "
                >
                </a-gltf-model>


                <a-text

                    value="Belalang"

                    align="center"

                    color="white"

                    position="
                        0
                        -0.055
                        0
                    "

                    scale="
                        0.35
                        0.35
                        0.35
                    "
                >
                </a-text>

            </a-entity>


            <!-- ================================================= -->
            <!-- KATAK -->
            <!-- ================================================= -->

            <a-entity
                position="0 0.03 0"
            >

                <a-gltf-model

                    class="clickable"

                    src="#katakModel"

                    position="0 0.035 0"

                    rotation="0 0 0"

                    scale="
                        0.030
                        0.030
                        0.030
                    "

                    info-object="
                        name: Katak;
                        role: Konsumen tingkat II;
                        description: Katak memakan belalang dan serangga lainnya. Katak kemudian dapat dimakan oleh ular.
                    "
                >
                </a-gltf-model>


                <a-text

                    value="Katak"

                    align="center"

                    color="white"

                    position="
                        0
                        -0.065
                        0
                    "

                    scale="
                        0.35
                        0.35
                        0.35
                    "
                >
                </a-text>

            </a-entity>


            <!-- ================================================= -->
            <!-- ULAR -->
            <!-- ================================================= -->

            <a-entity
                position="0.36 0.03 0"
            >

                <a-gltf-model

                    class="clickable"

                    src="#ularModel"

                    position="0 0.035 0"

                    rotation="0 0 0"

                    scale="
                        0.030
                        0.030
                        0.030
                    "

                    info-object="
                        name: Ular;
                        role: Konsumen tingkat III;
                        description: Ular memakan katak dan hewan kecil lainnya. Ular kemudian menjadi mangsa bagi elang.
                    "
                >
                </a-gltf-model>


                <a-text

                    value="Ular"

                    align="center"

                    color="white"

                    position="
                        0
                        -0.065
                        0
                    "

                    scale="
                        0.35
                        0.35
                        0.35
                    "
                >
                </a-text>

            </a-entity>


            <!-- ================================================= -->
            <!-- ELANG -->
            <!-- ================================================= -->

            <a-entity
                position="0 0.43 0"
            >

                <a-gltf-model

                    class="clickable"

                    src="#elangModel"

                    position="0 0 0"

                    rotation="0 0 0"

                    scale="
                        0.040
                        0.040
                        0.040
                    "

                    info-object="
                        name: Elang;
                        role: Konsumen tingkat IV / Predator puncak;
                        description: Elang merupakan predator tingkat tinggi dalam rantai makanan sawah. Elang dapat memangsa ular dan hewan lainnya.
                    "
                >
                </a-gltf-model>


                <a-text

                    value="Elang"

                    align="center"

                    color="white"

                    position="
                        0
                        -0.10
                        0
                    "

                    scale="
                        0.35
                        0.35
                        0.35
                    "
                >
                </a-text>

            </a-entity>


        </a-entity>

    </a-scene>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>

</html>

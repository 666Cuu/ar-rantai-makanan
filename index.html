<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR Ekosistem Sawah</title>


    <!-- ========================= -->
    <!-- A-FRAME -->
    <!-- ========================= -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js" crossorigin="anonymous"></script>


    <!-- ========================= -->
    <!-- MINDAR -->
    <!-- ========================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" crossorigin="anonymous">
    </script>


    <!-- ========================= -->
    <!-- STYLE -->
    <!-- ========================= -->

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        canvas.a-canvas {
            touch-action: none !important;
        }


        /* ========================= */
        /* PETUNJUK BAWAH */
        /* ========================= */

        #info {
            position: fixed;

            left: 15px;
            right: 15px;
            bottom: 12px;

            text-align: center;

            color: white;

            text-shadow:
                0 0 4px black;

            z-index: 1000;

            pointer-events: none;

            font-size: 13px;
        }


        /* ========================= */
        /* JUDUL ATAS */
        /* ========================= */

        #titleAR {

            position: fixed;

            top: 15px;

            left: 5%;
            right: 5%;

            padding: 10px 15px;

            background:
                rgba(0, 0, 0, 0.65);

            border-radius: 15px;

            color: #FFEB3B;

            text-align: center;

            font-size: 18px;
            font-weight: bold;

            z-index: 1000;

            pointer-events: none;
        }


        /* ========================= */
        /* KETERANGAN RANTAI */
        /* ========================= */

        #chain {

            position: fixed;

            top: 62px;

            left: 3%;
            right: 3%;

            padding: 7px;

            background:
                rgba(0, 0, 0, 0.55);

            border-radius: 12px;

            color: white;

            text-align: center;

            font-size: 11px;

            z-index: 1000;

            pointer-events: none;
        }


        /* ========================= */
        /* PANEL INFORMASI */
        /* ========================= */

        #informationPanel {

            display: none;

            position: fixed;

            left: 5%;
            right: 5%;

            bottom: 48px;

            background:
                rgba(20, 20, 20, 0.94);

            color: white;

            padding: 15px;

            border-radius: 18px;

            z-index: 3000;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.55);
        }


        #informationPanel h2 {

            margin: 0 30px 8px 0;

            text-align: center;

            color: #FFEB3B;

            font-size: 20px;
        }


        #informationPanel p {

            margin: 5px 0;

            line-height: 1.4;

            font-size: 14px;
        }


        #closeInfo {

            position: absolute;

            top: 5px;
            right: 10px;

            border: none;

            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;
        }


        #infoRole {

            color: #81D4FA;

            font-weight: bold;
        }


        /* ========================= */
        /* INDIKATOR ZOOM */
        /* ========================= */

        #zoomIndicator {

            display: none;

            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: rgba(0, 0, 0, 0.6);

            color: white;

            padding: 6px 14px;

            border-radius: 20px;

            font-size: 13px;

            z-index: 1500;

            pointer-events: none;
        }


        /* ========================= */
        /* MATIKAN OVERLAY BAWAAN MINDAR */
        /* (ikon scanning/loading di tengah layar kadang masih */
        /* menangkap sentuhan walau sudah tidak terlihat) */
        /* ========================= */

        .mindar-ui-overlay,
        .mindar-ui-scanning,
        .mindar-ui-loading,
        .mindar-ui-compatibility {
            pointer-events: none !important;
        }


    </style>


    <!-- ========================= -->
    <!-- SCRIPT INTERAKSI -->
    <!-- ========================= -->

    <script>

        AFRAME.registerComponent(
            'info-object',
            {
                schema: {
                    name: { type: 'string' },
                    role: { type: 'string' },
                    description: { type: 'string' }
                }
                // Tidak ada listener klik/touch di sini --
                // interaksi sentuh ditangani lewat raycasting manual di bawah,
                // supaya konsisten kedeteksi untuk semua objek (bukan cuma satu).
            }
        );


        function showInformation(
            name,
            role,
            description
        ) {

            document
                .getElementById("infoTitle")
                .innerText = name;


            document
                .getElementById("infoRole")
                .innerText = role;


            document
                .getElementById("infoDescription")
                .innerText =
                description;


            document
                .getElementById("informationPanel")
                .style.display =
                "block";

        }


        function closeInformation() {

            document
                .getElementById("informationPanel")
                .style.display =
                "none";

        }

    </script>

</head>


<body>


    <!-- ========================= -->
    <!-- JUDUL -->
    <!-- ========================= -->

    <div id="titleAR">

        🌾 RANTAI MAKANAN SAWAH

    </div>


    <!-- ========================= -->
    <!-- ALUR RANTAI -->
    <!-- ========================= -->

    <div id="chain">

        🌱 Rumput
        →
        🦗 Belalang
        →
        🐸 Katak
        →
        🐍 Ular
        →
        🦅 Elang

    </div>


    <!-- ========================= -->
    <!-- PANEL INFORMASI -->
    <!-- ========================= -->

    <div id="informationPanel">

        <button
            id="closeInfo"
            onclick="closeInformation()"
        >
            ×
        </button>


        <h2 id="infoTitle">
            Informasi
        </h2>


        <p>
            <strong>Peran dalam rantai makanan:</strong>
        </p>


        <p id="infoRole"></p>


        <p>
            <strong>Penjelasan:</strong>
        </p>


        <p id="infoDescription"></p>

    </div>


    <!-- ========================= -->
    <!-- INDIKATOR ZOOM -->
    <!-- ========================= -->

    <div id="zoomIndicator"></div>


    <!-- ========================= -->
    <!-- PETUNJUK -->
    <!-- ========================= -->

    <div id="info">

        Sentuh objek untuk info &bull; Cubit 2 jari untuk zoom

    </div>


    <!-- ========================= -->
    <!-- A-SCENE -->
    <!-- ========================= -->

    <a-scene

        mindar-image="
            imageTargetSrc: ./marker-ekosistem-sawah-inner.mind;
            autoStart: true;
            uiScanning: yes;
            uiLoading: yes;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        cursor="
            rayOrigin: mouse;
            fuse: false;
        "

        raycaster="
            objects: .clickable;
            far: 10000;
        "
    >


        <!-- ========================= -->
        <!-- MODEL 3D -->
        <!-- ========================= -->

        <a-assets>


            <!-- RUMPUT -->

            <a-asset-item
                id="rumputModel"
                src="./models/grass.glb?v=2">
            </a-asset-item>


            <!-- BELALANG -->

            <a-asset-item
                id="belalangModel"
                src="./models/grasshopper.glb">
            </a-asset-item>


            <!-- KATAK -->

            <a-asset-item
                id="katakModel"
                src="./models/frog.glb">
            </a-asset-item>


            <!-- ULAR -->

            <a-asset-item
                id="ularModel"
                src="./models/snake.glb">
            </a-asset-item>


            <!-- ELANG -->

            <a-asset-item
                id="elangModel"
                src="./models/hawk.glb">
            </a-asset-item>


        </a-assets>


        <!-- ========================= -->
        <!-- KAMERA -->
        <!-- ========================= -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        >
        </a-camera>


        <!-- ========================= -->
        <!-- TARGET MINDAR -->
        <!-- ========================= -->

        <a-entity
            mindar-image-target="
                targetIndex: 0;
            "
        >


            <!-- ========================================================= -->
            <!-- SEMUA OBJEK DIBUNGKUS DI SINI SUPAYA BISA DI-ZOOM BARENG -->
            <!-- ========================================================= -->

            <a-entity id="content" scale="1 1 1">


                <!-- ================================================= -->
                <!-- RUMPUT -->
                <!-- ================================================= -->

                <a-entity
                    position="-0.72 0.03 0"
                >

                    <a-gltf-model

                        class="clickable"

                        src="#rumputModel"

                        position="0 0.03 0"

                        rotation="0 0 0"

                        scale="
                            0.12
                            0.12
                            0.12
                        "

                        info-object="
                            name: Rumput;
                            role: Produsen;
                            description: Rumput adalah produsen dalam rantai makanan. Rumput membuat makanan sendiri melalui fotosintesis dan menjadi sumber makanan bagi belalang.
                        "
                    >
                    </a-gltf-model>

                    <!-- Area sentuh transparan untuk layar HP -->
                    <a-sphere class="clickable" radius="0.06" position="0 0.06 0" material="transparent: true; opacity: 0" info-object="name: Rumput; role: Produsen; description: Rumput adalah produsen dalam rantai makanan. Rumput membuat makanan sendiri melalui fotosintesis dan menjadi sumber makanan bagi belalang."></a-sphere>

                    <a-text

                        value="Rumput"

                        align="center"

                        color="white"

                        position="
                            0
                            -0.07
                            0
                        "

                        scale="
                            0.35
                            0.35
                            0.35
                        "
                    >
                    </a-text>

                </a-entity>


                <!-- ================================================= -->
                <!-- BELALANG -->
                <!-- ================================================= -->

                <a-entity
                    position="-0.36 0.03 0"
                >

                    <a-gltf-model

                        class="clickable"

                        src="#belalangModel"

                        position="0 0.02 0"

                        rotation="0 0 0"

                        scale="
                            0.005
                            0.005
                            0.005
                        "

                        info-object="
                            name: Belalang;
                            role: Konsumen tingkat I;
                            description: Belalang memakan rumput untuk memperoleh energi. Belalang kemudian menjadi makanan bagi katak.
                        "
                    >
                    </a-gltf-model>

                    <!-- Area sentuh transparan untuk layar HP -->
                    <a-sphere class="clickable" radius="0.06" position="0 0.055 0" material="transparent: true; opacity: 0" info-object="name: Belalang; role: Konsumen tingkat I; description: Belalang memakan rumput untuk memperoleh energi. Belalang kemudian menjadi makanan bagi katak."></a-sphere>

                    <a-text

                        value="Belalang"

                        align="center"

                        color="white"

                        position="
                            0
                            -0.055
                            0
                        "

                        scale="
                            0.35
                            0.35
                            0.35
                        "
                    >
                    </a-text>

                </a-entity>


                <!-- ================================================= -->
                <!-- KATAK -->
                <!-- ================================================= -->

                <a-entity
                    position="0 0.03 0"
                >

                    <a-gltf-model

                        class="clickable"

                        src="#katakModel"

                        position="0 0.035 0"

                        rotation="0 0 0"

                        scale="
                            0.030
                            0.030
                            0.030
                        "

                        info-object="
                            name: Katak;
                            role: Konsumen tingkat II;
                            description: Katak memakan belalang dan serangga lainnya. Katak kemudian dapat dimakan oleh ular.
                        "
                    >
                    </a-gltf-model>

                    <!-- Area sentuh transparan untuk layar HP -->
                    <a-sphere class="clickable" radius="0.065" position="0 0.055 0" material="transparent: true; opacity: 0" info-object="name: Katak; role: Konsumen tingkat II; description: Katak memakan belalang dan serangga lainnya. Katak kemudian dapat dimakan oleh ular."></a-sphere>

                    <a-text

                        value="Katak"

                        align="center"

                        color="white"

                        position="
                            0
                            -0.065
                            0
                        "

                        scale="
                            0.35
                            0.35
                            0.35
                        "
                    >
                    </a-text>

                </a-entity>


                <!-- ================================================= -->
                <!-- ULAR -->
                <!-- ================================================= -->

                <a-entity
                    position="0.36 0.03 0"
                >

                    <a-gltf-model

                        class="clickable"

                        src="#ularModel"

                        position="0 0.035 0"

                        rotation="0 0 0"

                        scale="
                            0.030
                            0.030
                            0.030
                        "

                        info-object="
                            name: Ular;
                            role: Konsumen tingkat III;
                            description: Ular memakan katak dan hewan kecil lainnya. Ular kemudian menjadi mangsa bagi elang.
                        "
                    >
                    </a-gltf-model>

                    <!-- Area sentuh transparan untuk layar HP -->
                    <a-sphere class="clickable" radius="0.065" position="0 0.055 0" material="transparent: true; opacity: 0" info-object="name: Ular; role: Konsumen tingkat III; description: Ular memakan katak dan hewan kecil lainnya. Ular kemudian menjadi mangsa bagi elang."></a-sphere>

                    <a-text

                        value="Ular"

                        align="center"

                        color="white"

                        position="
                            0
                            -0.065
                            0
                        "

                        scale="
                            0.35
                            0.35
                            0.35
                        "
                    >
                    </a-text>

                </a-entity>


                <!-- ================================================= -->
                <!-- ELANG -->
                <!-- ================================================= -->

                <a-entity
                    position="0 0.43 0"
                >

                    <a-gltf-model

                        class="clickable"

                        src="#elangModel"

                        position="0 0 0"

                        rotation="0 0 0"

                        scale="
                            0.040
                            0.040
                            0.040
                        "

                        info-object="
                            name: Elang;
                            role: Konsumen tingkat IV / Predator puncak;
                            description: Elang merupakan predator tingkat tinggi dalam rantai makanan sawah. Elang dapat memangsa ular dan hewan lainnya.
                        "
                    >
                    </a-gltf-model>

                    <!-- Area sentuh transparan untuk layar HP -->
                    <a-sphere class="clickable" radius="0.08" position="0 0.06 0" material="transparent: true; opacity: 0" info-object="name: Elang; role: Konsumen tingkat IV / Predator puncak; description: Elang merupakan predator tingkat tinggi dalam rantai makanan sawah. Elang dapat memangsa ular dan hewan lainnya."></a-sphere>

                    <a-text

                        value="Elang"

                        align="center"

                        color="white"

                        position="
                            0
                            -0.10
                            0
                        "

                        scale="
                            0.35
                            0.35
                            0.35
                        "
                    >
                    </a-text>

                </a-entity>


            </a-entity>
            <!-- akhir #content -->


        </a-entity>

    </a-scene>


    <!-- ========================= -->
    <!-- SCRIPT TAP UNTUK INFO -->
    <!-- ========================= -->

    <script>

        (function () {
          try {

            const sceneEl = document.querySelector('a-scene');
            console.log('[AR-tap] script mulai jalan, sceneEl:', sceneEl);

            // Logger diagnostik: cetak elemen apa yang menangkap TIAP sentuhan,
            // di manapun di layar -- supaya kalau ada overlay tak terduga yang
            // menghalangi (misalnya UI bawaan MindAR), langsung ketahuan class/id-nya.
            window.addEventListener('touchstart', function (e) {
                console.log('[AR-tap][diag] touch kena elemen:', e.target.tagName, e.target.className || '(tanpa class)', e.target.id || '(tanpa id)');
            }, { capture: true, passive: true });

            function handleTap(clientX, clientY) {
                const camera = sceneEl.camera;
                if (!camera) {
                    console.warn('[AR-tap] kamera belum siap');
                    return;
                }

                const canvas = sceneEl.canvas;
                const rect = canvas.getBoundingClientRect();

                const mouse = new AFRAME.THREE.Vector2();
                mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

                const raycaster = new AFRAME.THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);

                const clickableEls = document.querySelectorAll('.clickable');
                const objects = [];
                clickableEls.forEach(function (el) {
                    if (el.object3D) objects.push(el.object3D);
                });

                const intersects = raycaster.intersectObjects(objects, true);
                console.log('[AR-tap] clickable els:', clickableEls.length, '| intersects:', intersects.length);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj && !obj.el) {
                        obj = obj.parent;
                    }
                    if (obj && obj.el) {
                        const data = obj.el.getAttribute('info-object');
                        console.log('[AR-tap] kena entity:', obj.el, '| data:', data);
                        if (data && data.name) {
                            showInformation(data.name, data.role, data.description);
                        }
                    } else {
                        console.log('[AR-tap] tidak nemu entity dengan .el');
                    }
                }
            }

            function attachHandlers() {
                const canvas = sceneEl.canvas;
                if (!canvas) {
                    console.warn('[AR-tap] canvas belum ada, coba lagi sebentar...');
                    setTimeout(attachHandlers, 300);
                    return;
                }

                let touchStartX = 0, touchStartY = 0, touchStartTime = 0, isMultiTouch = false;

                canvas.addEventListener('touchstart', function (e) {
                    if (e.touches.length === 1) {
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                        touchStartTime = Date.now();
                        isMultiTouch = false;
                    } else if (e.touches.length >= 2) {
                        isMultiTouch = true;
                    }
                }, { passive: true });

                canvas.addEventListener('touchend', function (e) {
                    if (isMultiTouch) return;
                    if (e.changedTouches.length !== 1) return;

                    const dx = e.changedTouches[0].clientX - touchStartX;
                    const dy = e.changedTouches[0].clientY - touchStartY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const duration = Date.now() - touchStartTime;

                    if (dist < 20 && duration < 600) {
                        handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                    }
                }, { passive: true });

                canvas.addEventListener('click', function (e) {
                    handleTap(e.clientX, e.clientY);
                });

                console.log('[AR-tap] handler tap terpasang di canvas:', canvas);
            }

            attachHandlers();

          } catch (err) {
            console.error('[AR-tap] ERROR saat setup:', err);
          }
        })();

    </script>


    <!-- ========================= -->
    <!-- SCRIPT PINCH-TO-ZOOM -->
    <!-- ========================= -->

    <script>

        (function () {

            const content = document.querySelector('#content');
            const zoomIndicator = document.querySelector('#zoomIndicator');

            let currentScale = 1;
            const MIN_SCALE = 0.3;
            const MAX_SCALE = 3;

            let startDist = 0;
            let startScale = 1;
            let hideTimeout = null;

            function getDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            function applyScale(scale) {
                currentScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale));
                content.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);

                zoomIndicator.style.display = 'block';
                zoomIndicator.innerText = Math.round(currentScale * 100) + '%';

                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(function () {
                    zoomIndicator.style.display = 'none';
                }, 800);
            }

            window.addEventListener('touchstart', function (e) {
                if (e.touches.length === 2) {
                    startDist = getDistance(e.touches);
                    startScale = currentScale;
                }
            }, { capture: true, passive: true });

            window.addEventListener('touchmove', function (e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const newDist = getDistance(e.touches);
                    const ratio = newDist / startDist;
                    applyScale(startScale * ratio);
                }
            }, { capture: true, passive: false });

            // Bonus: scroll wheel untuk testing zoom di laptop/desktop
            window.addEventListener('wheel', function (e) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.05 : 0.05;
                applyScale(currentScale + delta);
            }, { capture: true, passive: false });

        })();

    </script>


</body>

</html>

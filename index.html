<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Ekosistem Sawah</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Panel pemilihan kamera */
        #cameraPanel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;

            width: 90%;
            max-width: 400px;

            padding: 18px;
            box-sizing: border-box;

            background: rgba(0, 0, 0, 0.85);
            border-radius: 15px;

            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #cameraPanel h2 {
            margin: 0 0 12px;
            font-size: 20px;
        }

        #cameraSelect {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;

            border-radius: 8px;
            border: none;

            font-size: 16px;
        }

        #startButton {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #4CAF50;
            color: white;

            font-size: 16px;
            font-weight: bold;
        }

        #startButton:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 10px;
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <!-- PANEL PILIH KAMERA -->
    <div id="cameraPanel">

        <h2>📷 Pilih Kamera</h2>

        <select id="cameraSelect">
            <option value="">Memuat kamera...</option>
        </select>

        <button id="startButton">
            MULAI AR
        </button>

        <div id="status">
            Pilih kamera belakang yang tidak zoom.
        </div>

    </div>


    <!-- AR SCENE -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="
            sourceType: webcam;
            sourceWidth: 480;
            sourceHeight: 640;
            displayWidth: 480;
            displayHeight: 640;
            debugUIEnabled: false;
        ">

        <!-- MARKER EKOSISTEM SAWAH -->
        <a-marker
            type="pattern"
            url="https://666cuu.github.io/ar-rantai-makanan/pattern-marker.patt">

            <!-- KUBUS TES -->
            <a-box
                position="0 0.5 0"
                scale="0.5 0.5 0.5"
                color="green">
            </a-box>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>


    <script>

        const cameraSelect = document.getElementById("cameraSelect");
        const startButton = document.getElementById("startButton");
        const cameraPanel = document.getElementById("cameraPanel");
        const status = document.getElementById("status");

        let currentStream = null;


        // ==========================================
        // MENCARI SEMUA KAMERA
        // ==========================================

        async function getCameras() {

            try {

                // Meminta izin kamera terlebih dahulu
                const tempStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });

                tempStream.getTracks().forEach(track => track.stop());


                const devices =
                    await navigator.mediaDevices.enumerateDevices();


                const cameras =
                    devices.filter(device =>
                        device.kind === "videoinput"
                    );


                cameraSelect.innerHTML = "";


                cameras.forEach((camera, index) => {

                    const option =
                        document.createElement("option");

                    option.value = camera.deviceId;

                    option.textContent =
                        camera.label ||
                        `Kamera ${index + 1}`;

                    cameraSelect.appendChild(option);

                });


                // Coba pilih kamera belakang
                const backCamera =
                    cameras.find(camera =>
                        /back|rear|environment|belakang/i
                        .test(camera.label)
                    );


                if (backCamera) {

                    cameraSelect.value =
                        backCamera.deviceId;

                }


                status.textContent =
                    cameras.length +
                    " kamera ditemukan. Pilih kamera yang tidak zoom.";


            } catch (error) {

                console.error(error);

                status.textContent =
                    "Tidak dapat membaca kamera.";

            }

        }


        // ==========================================
        // MULAI AR
        // ==========================================

        startButton.addEventListener("click", async () => {

            const deviceId =
                cameraSelect.value;


            if (!deviceId) {

                alert("Pilih kamera terlebih dahulu.");

                return;

            }


            try {

                // Hentikan kamera sebelumnya
                if (currentStream) {

                    currentStream
                        .getTracks()
                        .forEach(track => track.stop());

                }


                // Minta kamera yang dipilih
                currentStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            deviceId: {
                                exact: deviceId
                            }
                        },

                        audio: false

                    });


                // Cari video AR.js
                const video =
                    document.getElementById("arjs-video");


                if (video) {

                    video.srcObject =
                        currentStream;

                    await video.play();

                }


                // Sembunyikan panel
                cameraPanel.style.display =
                    "none";


            } catch (error) {

                console.error(error);

                alert(
                    "Kamera tidak dapat digunakan: " +
                    error.message
                );

            }

        });


        // Jalankan pencarian kamera
        getCameras();

    </script>

</body>
</html>

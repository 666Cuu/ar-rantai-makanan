<title>AR Ekosistem Sawah</title>

<!-- A-Frame -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>

<!-- MindAR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
    body {
        margin: 0;
        overflow: hidden;
    }

    #info {
        position: fixed;
        bottom: 12px;
        left: 0;
        right: 0;
        text-align: center;
        color: white;
        text-shadow: 0 0 4px black;
        z-index: 999;
        pointer-events: none;
        font-size: 14px;
        font-family: sans-serif;
    }
</style>
```

</head>

<body>

```
<div id="info">
    Arahkan kamera ke marker untuk melihat rantai makanan sawah 🌾
</div>

<a-scene
    mindar-image="
        imageTargetSrc: ./marker-ekosistem-sawah-inner.mind;
        autoStart: true;
        uiScanning: yes;
        uiLoading: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
>

    <!-- ========================= -->
    <!-- MODEL 3D -->
    <!-- ========================= -->

    <a-assets>

        <!-- Rumput -->
        <a-asset-item
            id="rumputModel"
            src="./models/grass.glb">
        </a-asset-item>

        <!-- Belalang -->
        <a-asset-item
            id="belalangModel"
            src="./models/grasshopper.glb">
        </a-asset-item>

        <!-- Katak -->
        <a-asset-item
            id="katakModel"
            src="./models/frog.glb">
        </a-asset-item>

        <!-- Ular -->
        <a-asset-item
            id="ularModel"
            src="./models/snake.glb">
        </a-asset-item>

        <!-- Elang -->
        <a-asset-item
            id="elangModel"
            src="./models/hawk.glb">
        </a-asset-item>

    </a-assets>


    <!-- ========================= -->
    <!-- KAMERA -->
    <!-- ========================= -->

    <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        cursor="fuse: false; rayOrigin: mouse;"
        raycaster="far: 10000;">
    </a-camera>


    <!-- ========================= -->
    <!-- IMAGE TARGET -->
    <!-- ========================= -->

    <a-entity mindar-image-target="targetIndex: 0">

```
<!-- ========================= -->
<!-- RUMPUT -->
<!-- ========================= -->

<a-entity position="-0.8 0.05 0">

    <a-gltf-model
        src="#rumputModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.25 0.25 0.25">

</a-entity>
